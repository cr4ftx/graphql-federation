services:
  hive-router:
    image: ghcr.io/graphql-hive/router:latest
    volumes:
      - ./supergraph.graphql:/app/supergraph.graphql
      - ./router.config.yaml:/app/router.config.yaml
    ports:
      - 4000:4000
